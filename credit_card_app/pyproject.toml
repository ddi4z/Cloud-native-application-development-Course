[tool.poetry]
name = "credit_card_app"
version = "1.0.0"
description = "Microservicio para la gestión de tarjetas de crédito."
authors = ["Tu Nombre <tu.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.1"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
psycopg2-binary = "^2.9.9" # Para PostgreSQL
boto3 = "^1.34.97"         # Para AWS SQS
pyjwt = "^2.8.0"          # Para manejar tokens

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0" # Para pruebas de cliente HTTP

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"