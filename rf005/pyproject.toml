[tool.poetry]
name = "rf005"
version = "1.0.0"
description = "Microservicio para orquestar la consulta de publicaciones (RF-005)."
authors = ["Jorge Paternina <j.paterninam@uniandes.edu.co>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "rf005", from = "src" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "~0.111.0"
uvicorn = "~0.29.0"
pydantic = "~2.7.1"
python-dotenv = "~1.0.1"
httpx = "~0.27.0" # For making async HTTP requests to other services

[tool.poetry.group.dev.dependencies]
black = "~24.1.0"
ruff = "~0.1.12"
pytest = "~8.0.0"
pytest-cov = "~5.0.0"
pytest-mock = "~3.12.0"
faker = "~24.4.0"

[tool.isort]
profile= "black"
multi_line_output = 3

[tool.ruff]
src = ["src"]
fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
python_files = "test_*.py"
pythonpath = "."
testpaths = ["tests"]