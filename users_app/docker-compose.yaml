services:
  users-ms-service:
    build:
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@users-db-service:5432/usersdb
    depends_on:
      - users-db-service

  users-db-service:
    image: postgres:15-alpine
    container_name: users-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usersdb
    volumes:
      - users_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" 

volumes:
  users_data:
