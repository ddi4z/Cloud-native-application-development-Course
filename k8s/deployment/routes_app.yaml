---
# Despliegue de la Aplicación de Rutas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      # Removed initContainers section
      containers:
        - name: routes-app
          image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/deployment/dann-grp19:routes-app-v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: CONNECTION_STRING
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

---
# Servicio para la Aplicación
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  labels:
    app: routes-app
spec:
  type: ClusterIP   # <-- cambiado a ClusterIP
  selector:
    app: routes-app
  ports:
    - name: http
      protocol: TCP
      port: 80        # puerto dentro del cluster
      targetPort: 8000 # puerto interno del contenedor
