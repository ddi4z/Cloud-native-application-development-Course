---
# Despliegue de la Aplicación de Rutas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-app-deployment
  labels:
    app: posts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-app
  template:
    metadata:
      labels:
        app: posts-app
    spec:
      # Removed initContainers section
      containers:
        - name: posts-app
          image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/deployment/dann-grp19:posts-app-v1.0.0 # CAMBIAR URI
          imagePullPolicy: IfNotPresent # Always
          ports:
            - containerPort: 9000
          env:
            # TODO BUSCAR MANERA DE CAMBIAR ESTO
            - name: DATABASE_URL
              value: "postgresql://dann20252:dann20252@terraform-20250913154012671500000001.cnwq8kyk654s.us-east-1.rds.amazonaws.com:5432/delivery_db"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /posts/ping
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

---
# Servicio para la Aplicación
apiVersion: v1
kind: Service
metadata:
  name: posts-app-service
  labels:
    app: posts-app
spec:
  type: ClusterIP   # <-- cambiado a ClusterIP
  selector:
    app: posts-app
  ports:
    - name: http
      protocol: TCP
      port: 80        # puerto dentro del cluster
      targetPort: 9000 # puerto interno del contenedor
