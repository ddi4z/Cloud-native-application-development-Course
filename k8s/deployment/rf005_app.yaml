apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf005-app-deployment
  labels:
    app: rf005-app
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: rf005-app
  template:
    metadata:
      labels:
        app: rf005-app
    spec:
      containers:
      - name: rf005-app
        image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/rf005-repository:rf005-app-v1.0.0 # URI
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /rf005/ping
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        env:
          - name: USERS_SERVICE_URL
            value: "http://users-app-service"
          - name: POSTS_SERVICE_URL
            value: "http://posts-app-service"
          - name: ROUTES_SERVICE_URL
            value: "http://routes-app-service"
          - name: OFFERS_SERVICE_URL
            value: "http://offers-app-service"
          - name: SCORES_SERVICE_URL
            value: "http://scores-app-service"
---
# Service to expose the rf005_app pod
apiVersion: v1
kind: Service
metadata:
  name: rf005-app-service
  labels:
    app: rf005-app
spec:
  # nodePort exposes the service on each Node's IP at a static port (the NodePort).
  type: ClusterIP
  selector:
    app: rf005-app
  ports:
  - protocol: TCP
    port: 80        # Port exposed by the service
    targetPort: 8005  # Port on the pod to which traffic is directed
