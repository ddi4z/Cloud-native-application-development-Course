#####################################
# Local deployment for rf004_app    #
#####################################
# Define the deployment for the rf004-app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf004-app-deployment
  labels:
    app: rf004-app
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: rf004-app
  template:
    metadata:
      labels:
        app: rf004-app
    spec:
      containers:
      - name: rf004-app
        image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/deployment/dann-grp19:rf004-app-v1.0.0 # URI
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /rf004/ping
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        env:
          - name: USERS_SERVICE_URL
            value: "http://users-app-service/users"
          - name: POSTS_SERVICE_URL
            value: "http://posts-app-service/posts"
          - name: ROUTES_SERVICE_URL
            value: "http://routes-app-service/routes"
          - name: OFFERS_SERVICE_URL
            value: "http://offers-app-service/offers"
          - name: SCORES_SERVICE_URL
            value: "http://scores-app-service/scores"
---
# Service to expose the rf004_app pod
apiVersion: v1
kind: Service
metadata:
  name: rf004-app-service
  labels:
    app: rf004-app
spec:
  # nodePort exposes the service on each Node's IP at a static port (the NodePort).
  type: ClusterIP
  selector:
    app: rf004-app
  ports:
  - protocol: TCP
    port: 80        # Port exposed by the service
    targetPort: 9000  # Port on the pod to which traffic is directed
