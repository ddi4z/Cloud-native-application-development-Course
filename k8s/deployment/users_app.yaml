---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      containers:
        - name: users-app
          image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/users-repository:users-app-v1.0.0
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: CONNECTION_STRING
          livenessProbe:
            httpGet:
              path: /users/ping   # ← puse "/" delante
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
  labels:
    app: users-app
spec:
  type: ClusterIP 
  selector:
    app: users-app
  ports:
    - protocol: TCP
      port: 80   
      targetPort: 9000 
