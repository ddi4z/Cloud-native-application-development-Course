---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      # Removed initContainers section
      containers:
        - name: users-app
          image: 637423520989.dkr.ecr.us-east-1.amazonaws.com/deployment/dann-grp19:users-app-v1.0.0
          ports:
            - containerPort: 9000
          # CAMBIAR ESTO
          env:
            - name: DATABASE_URL
              value: "postgresql://dann20252:dann20252@terraform-20250913154012671500000001.cnwq8kyk654s.us-east-1.rds.amazonaws.com:5432/delivery_db"
          livenessProbe:
            httpGet:
              path: /users/ping   # ← puse "/" delante
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
  labels:
    app: users-app
spec:
  type: ClusterIP 
  selector:
    app: users-app
  ports:
    - protocol: TCP
      port: 80   
      targetPort: 9000 
