apiVersion: v1
kind: Service
metadata:
  name: rf005-app-service
  labels:
    app: rf005-app
spec:
  type: NodePort
  selector:
    app: rf005-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8005
      nodePort: 30005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf005-app-deployment
  labels:
    app: rf005-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf005-app
  template:
    metadata:
      labels:
        app: rf005-app
    spec:
      containers:
        - name: rf005-app
          image: rf005-app:v1.0.0 
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8005
          env:
            - name: USERS_APP_URL
              value: "http://users-app-service"
            - name: POSTS_APP_URL
              value: "http://posts-app-service"
            - name: OFFERS_APP_URL
              value: "http://offers-app-service"
            - name: ROUTES_APP_URL #Declarado aunque no utilizado en para la entrega 2
              value: "http://routes-app-service"
            # Score app de momento no se usa porque se hará mock mientras se desarrolla
          livenessProbe:
            httpGet:
              path: /rf005/ping
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /rf005/ping
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10