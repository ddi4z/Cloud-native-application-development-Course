apiVersion: v1
kind: Service
metadata:
  name: rf003-app-service
  labels:
    app: rf003-app
spec:
  type: NodePort
  selector:
    app: rf003-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
      nodePort: 30009
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf003-app-deployment
  labels:
    app: rf003-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf003-app
  template:
    metadata:
      labels:
        app: rf003-app
    spec:
      containers:
        - name: rf003-app
          # La imagen y etiqueta deben coincidir exactamente con el comando 'docker build'
          image: rf003-app:v1.0.0
          # 'IfNotPresent' es ideal para desarrollo local con Minikube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            # Nombres de variables correctos que el código espera encontrar
            - name: USERS_SERVICE_URL
              value: "http://users-app-service"
            - name: POSTS_SERVICE_URL
              value: "http://posts-app-service"
            - name: ROUTES_SERVICE_URL
              value: "http://routes-app-service"
            - name: OFFERS_SERVICE_URL
              value: "http://offers-app-service"
          # Sondas de salud para asegurar que el pod está funcionando correctamente
          livenessProbe:
            httpGet:
              path: /rf003/ping
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /rf003/ping
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
