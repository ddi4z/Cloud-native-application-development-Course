apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-init-job
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-localstack
          image: busybox:1.36.1
          command: ['sh', '-c', 'until nc -z localstack-service 4566; do echo "Esperando a que el servicio de LocalStack esté disponible..."; sleep 2; done;']
      containers:
        - name: init-aws-resources
          image: amazon/aws-cli:latest
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "test" 
            - name: AWS_SECRET_ACCESS_KEY
              value: "test" 
          command: ["/bin/sh", "-c"]
          args:
            - "sleep 10 && aws --endpoint-url=http://localstack-service:4566 sqs create-queue --queue-name credit-card-verification-queue && aws --endpoint-url=http://localstack-service:4566 sqs create-queue --queue-name email-notification-queue"