---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scores-app
  labels:
    app: scores-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scores-app
  template:
    metadata:
      labels:
        app: scores-app
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for db; sleep 2; done;']
      containers:
        - name: scores-app
          image: scores-app:v1.0.0
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              value: postgresql://user:password@postgres-service:5432/main_db
          livenessProbe:
            httpGet:
              path: /scores/ping   # añadí "/" delante
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: scores-app-service
  labels:
    app: scores-app
spec:
  type: ClusterIP   # ← cambiado a ClusterIP
  selector:
    app: scores-app
  ports:
    - protocol: TCP
      port: 80         # expuesto dentro del cluster
      targetPort: 9000 # puerto interno del contenedor
