---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for db; sleep 2; done;']
      containers:
        - name: users-app
          image: users-app:v1.0.0
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              value: postgresql://user:password@postgres-service:5432/main_db
            - name: IDENTITY_VERIFIER_SERVICE_URL
              value: "http://service-truenative"
            - name: POLLING_QUEUE_URL
              value: "http://host.minikube.internal:55586/000000000000/credit-card-verification-queue" # Usar host.minikube.internal para acceder a LocalStack desde el cluster
            - name: AWS_ENDPOINT_URL
              value: "http://host.minikube.internal:55586" # Usar host.minikube.internal para acceder a LocalStack desde el cluster
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_REGION
              value: "us-east-1"
          livenessProbe:
            httpGet:
              path: /users/ping
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
  labels:
    app: users-app
spec:
  type: ClusterIP 
  selector:
    app: users-app
  ports:
    - protocol: TCP
      port: 80   
      targetPort: 9000 
