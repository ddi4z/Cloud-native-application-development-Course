---
# Despliegue de la Aplicación de Rutas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36.1
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "Esperando a la base de datos central..."; sleep 2; done;']
      containers:
        - name: routes-app
          image: routes-app:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://user:password@postgres-service:5432/main_db"
          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

---
# Servicio para la Aplicación
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  labels:
    app: routes-app
spec:
  type: ClusterIP   # <-- cambiado a ClusterIP
  selector:
    app: routes-app
  ports:
    - name: http
      protocol: TCP
      port: 80        # puerto dentro del cluster
      targetPort: 8000 # puerto interno del contenedor
