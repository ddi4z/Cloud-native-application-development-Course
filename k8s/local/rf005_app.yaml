apiVersion: v1
kind: Service
metadata:
  name: rf005-app-service
  labels:
    app: rf005-app
spec:
  type: NodePort
  selector:
    app: rf005-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8005
      nodePort: 30005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf005-app-deployment
  labels:
    app: rf005-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf005-app
  template:
    metadata:
      labels:
        app: rf005-app
    spec:
      containers:
        - name: rf005-app
          image: rf005-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          resources:
            requests:
              memory: "64Mi" # Solicita 64 mb de memoria RAM como mínimo.
              cpu: "100m" # Solicita 0.1 de un core de CPU como mínimo.
            limits:
              memory: "128Mi" # Permite max de 128 mb de RAM.
              cpu: "250m" # Permite un máximo de 0.25 de un core de CPU.
          env:
            - name: USERS_SERVICE_URL
              value: "http://users-app-service"
            - name: POSTS_SERVICE_URL
              value: "http://posts-app-service"
            - name: ROUTES_SERVICE_URL
              value: "http://routes-app-service"
            - name: OFFERS_SERVICE_URL
              value: "http://offers-app-service"
            - name: SCORES_SERVICE_URL
              value: "http://scores-app-service"
          livenessProbe:
            httpGet:
              path: /rf005/ping
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /rf005/ping
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10