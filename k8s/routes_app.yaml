# Despliegue DB (PostgreSQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-db-deployment 
  labels:
    app: routes-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-db
  template:
    metadata:
      labels:
        app: routes-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "routes_db" 
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-storage 
      volumes:
        - name: db-storage
          emptyDir: {} 

---
# Servicio para la DB
apiVersion: v1
kind: Service
metadata:
  name: routes-db 
spec:
  selector:
    app: routes-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# Despliegue de la Aplicación de Rutas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      containers:
        - name: routes-app
          image: routes-app:latest
          imagePullPolicy: Never 
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://user:password@routes-db:5432/routes_db"
          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 15 
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

---
# Servicio para la Aplicación
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# Política de Red para Aislar DB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routes-db-policy
spec:
  podSelector:
    matchLabels:
      app: routes-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routes-app
      ports:
        - protocol: TCP
          port: 5432