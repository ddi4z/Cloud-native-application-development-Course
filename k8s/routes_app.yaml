---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: routes-db-pvc
  labels:
    app: routes-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-db
  labels:
    app: routes-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-db
  template:
    metadata:
      labels:
        app: routes-db
    spec:
      containers:
        - name: routes-db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: routesdb
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: routes-db-storage
      volumes:
        - name: routes-db-storage
          persistentVolumeClaim:
            claimName: routes-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: routes-db-service
  labels:
    app: routes-db
spec:
  type: ClusterIP
  selector:
    app: routes-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z routes-db-service 5432; do echo waiting for db; sleep 2; done;']
      containers:
        - name: routes-app
          image: routes-app:v1.0.0
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              value: postgresql://user:password@routes-db-service:5432/routesdb
          livenessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 5 
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  labels:
    app: routes-app
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
      nodePort: 30002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routes-network
spec:
  podSelector:
    matchLabels:
      app: routes-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routes-app
      ports:
        - protocol: TCP
          port: 5432