# k8s/routes_app.yaml (Versión ultra-simplificada para InMemory)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      containers:
        - name: routes-app
          image: routes-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000