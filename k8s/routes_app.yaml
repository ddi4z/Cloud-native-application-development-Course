
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      containers:
        - name: routes-app
          image: routes-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /routes/ping 
              port: 8000
            initialDelaySeconds: 20 
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /routes/ping 
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000