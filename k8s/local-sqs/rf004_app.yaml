#####################################
# Local deployment for rf004_app    #
#####################################

# Service to expose the rf004_app pod
apiVersion: v1
kind: Service 
metadata:
  name: rf004-app-service
  labels:
    app: rf004-app
spec:
  # nodePort exposes the service on each Node's IP at a static port (the NodePort).
  type: NodePort
  selector:
    app: rf004-app
  ports:
  - protocol: TCP
    port: 80        # Port exposed by the service
    targetPort: 9000  # Port on the pod to which traffic is directed
    nodePort: 30003   # Port on each node to expose the service

---
# Define the deployment for the rf004-app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf004-app-deployment
  labels:
    app: rf004-app
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: rf004-app
  template:
    metadata:
      labels:
        app: rf004-app
    spec:
      # initContainers:
      # - name: wait-for-users
      #   image: busybox
      #   command:
      #   - sh
      #   - -c
      #   - |
      #     until nc -z users-service 5432; do
      #       echo "Waiting for postgres database..."
      #       sleep 2
      #     done
      containers:
      - name: rf004-app
        image: rf004-app:v1.0.0
        ports:
        - containerPort: 9000 # this port is exposed by the container
        livenessProbe:
          httpGet:
            path: /rf004/ping
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        env:
          - name: USERS_SERVICE_URL
            value: "http://users-app-service"
          - name: POSTS_SERVICE_URL
            value: "http://posts-app-service"
          - name: ROUTES_SERVICE_URL
            value: "http://routes-app-service"
          - name: OFFERS_SERVICE_URL
            value: "http://offers-app-service"
          - name: SCORES_SERVICE_URL
            value: "http://scores-app-service"
