apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      containers:
      - name: users-app
        image: users-app:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 9000
apiVersion: v1
kind: Service
metadata:
  name: users-app
spec:
  type: NodePort
  selector:
    app: users-app
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30007 