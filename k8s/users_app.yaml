# users-app: Deployment y Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36.1
        command: ['sh', '-c', 'until nc -z users-db-service 5432; do echo waiting for users-db-service; sleep 2; done;']
      containers:
      - name: users-app
        image: users-app:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 9000
        env:
        - name: DATABASE_URL
          value: postgres://user:password@users-db-service:5432/usersdb

---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
spec:
  type: ClusterIP
  selector:
    app: users-app
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
      - name: users-db
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: usersdb
        - name: POSTGRES_USER
          value: user
        - name: POSTGRES_PASSWORD
          value: password
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - user
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - user
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: postgres-data
        hostPath:
          path: "/tmp/data/users-db"
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: users-db-service
spec:
  selector:
    app: users-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-network
spec:
  podSelector:
    matchLabels:
      app: users-db
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: users-app
      ports:
        - protocol: TCP
          port: 5432